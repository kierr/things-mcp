name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Test
    needs: [gitleaks]
    if: always() && (needs.gitleaks.result == 'success' || needs.gitleaks.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  release:
    name: Release
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Main is protected (PRs only), so the bot cannot push version bumps
    # directly. Two-phase flow, release-please style:
    #   1. Releasable commits land on main, package.json version already
    #      tagged → open a chore/release-vX.Y.Z PR bumping package.json.
    #   2. That PR merges, so package.json's version has no tag yet →
    #      build, publish to npm, push the tag, create the GitHub Release.
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - run: bun install --frozen-lockfile

      - name: Determine release action
        id: release
        run: |
          # If package.json's version is untagged, this push IS the release
          # (a merged release PR, or the first release) → publish it.
          # Otherwise look for releasable commits and open a bump PR.
          CURRENT=$(jq -r .version package.json)
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${CURRENT}" >/dev/null 2>&1; then
            echo "mode=maybe-pr" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump
        if: steps.release.outputs.mode == 'maybe-pr'
        id: semver
        run: |
          # A version tag always exists in this mode (checked above).
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1 || echo "")
          # Collect conventional commit types since last tag
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" --no-merges 2>/dev/null)

          if [ -z "$COMMITS" ]; then
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "reason=No commits since last tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Breaking changes → major
          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
            echo "reason=Breaking change detected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Features → minor
          if echo "$COMMITS" | grep -qE '^feat'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            echo "reason=Feature commit detected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fixes → patch
          if echo "$COMMITS" | grep -qE '^fix'; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "reason=Fix commit detected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=none" >> "$GITHUB_OUTPUT"
          echo "reason=No feat/fix commits since last tag" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        if: steps.release.outputs.mode == 'maybe-pr' && steps.semver.outputs.bump != 'none'
        id: version
        run: |
          CURRENT="${{ steps.release.outputs.current }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.semver.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Proposing ${CURRENT} → ${NEXT} (${{ steps.semver.outputs.reason }})"

      - name: Open release PR
        if: steps.release.outputs.mode == 'maybe-pr' && steps.semver.outputs.bump != 'none'
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          jq --arg v "$NEXT" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/release-v${NEXT}"
          git checkout -B "$BRANCH"
          git add package.json
          git commit -m "Chore: bump version to v${NEXT}" || true
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --json number --jq '.[].number')" ]; then
            gh pr create --title "Chore: bump version to v${NEXT}" \
              --body "Automated version bump (${{ steps.semver.outputs.reason }}). Merging this PR publishes v${NEXT} to npm, tags it, and creates the GitHub Release." \
              --base main --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.release.outputs.mode == 'publish'
        run: bun run build

      - name: Publish to npm
        if: steps.release.outputs.mode == 'publish'
        run: |
          PKG=$(jq -r .name package.json)
          if npm view "${PKG}@${{ steps.release.outputs.current }}" version >/dev/null 2>&1; then
            echo "${PKG}@${{ steps.release.outputs.current }} already on npm — skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.release.outputs.mode == 'publish'
        run: |
          git tag "v${{ steps.release.outputs.current }}"
          git push origin "v${{ steps.release.outputs.current }}"

      - name: Generate release notes
        if: steps.release.outputs.mode == 'publish'
        id: notes
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | head -2 | tail -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          echo "$NOTES" > /tmp/release-notes.txt
          echo "file=/tmp/release-notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release.outputs.mode == 'publish'
        run: |
          gh release create "v${{ steps.release.outputs.current }}" \
            --title "v${{ steps.release.outputs.current }}" \
            --notes-file "${{ steps.notes.outputs.file }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
